<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
        }
        .header {
            color: #2c3e50;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .otp-code {
            display: inline-block;
            background-color: #f4f7f6;
            color: #27ae60;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            padding: 15px 30px;
            border-radius: 5px;
            margin: 20px 0;
            border: 1px dashed #27ae60;
        }
        .footer {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">PhoneBazar Verification</div>
        <p>Hi {{ firstname }},</p>
        <p>Thank you for joining PhoneBazar. Use the code below to verify your account and get started:</p>
        
        <div class="otp-code">{{ otp }}</div>
        
        <p>This code will expire in 10 minutes. If you did not request this, please ignore this email.</p>
        
        <div class="footer">
            &copy; 2026 PhoneBazar Inc. | Surat, Gujarat
        </div>
    </div>
</body>
</html>
