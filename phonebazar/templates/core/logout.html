<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - PhoneBazar</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f1f8e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logout-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 8px solid #2eaf7d;
        }
        .icon-circle {
            width: 70px;
            height: 70px;
            background-color: #e8f5e9;
            color: #2eaf7d;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; line-height: 1.5; }
        .btn-login {
            background-color: #2eaf7d;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s;
            display: inline-block;
        }
        .btn-login:hover {
            background-color: #238b63;
        }
    </style>
</head>
<body>

    <div class="logout-card">
        <div class="icon-circle">✓</div>
        <h2>Logged Out</h2>
        <p>You have been safely logged out of <strong>PhoneBazar</strong>. See you again soon!</p>
        
        <a href="{% url 'login' %}" class="btn-login">Login Again</a>
        <br>
        <a href="/" style="display: block; margin-top: 15px; color: #888; text-decoration: none; font-size: 14px;">Return to Home</a>
    </div>

</body>
</html>
