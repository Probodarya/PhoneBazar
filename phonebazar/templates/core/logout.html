{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logged Out - PhoneBazar</title>

<style>

body{
font-family:'Segoe UI', Arial, sans-serif;

/* Background image */
background:
linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
url("{% static 'images/back.png' %}");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

/* Logout card */

.logout-card{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
text-align:center;
max-width:400px;
width:90%;
border-top:8px solid #2eaf7d;
}

.icon-circle{
width:70px;
height:70px;
background:#e8f5e9;
color:#2eaf7d;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
margin:auto;
font-size:30px;
margin-bottom:20px;
}

h2{
color:#333;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:30px;
line-height:1.5;
}

.btn-login{
background:#2eaf7d;
color:white;
padding:12px 30px;
text-decoration:none;
border-radius:25px;
font-weight:bold;
display:inline-block;
transition:.3s;
}

.btn-login:hover{
background:#238b63;
}

.home-link{
display:block;
margin-top:15px;
color:#888;
text-decoration:none;
font-size:14px;
}

.home-link:hover{
color:#444;
}

</style>
</head>

<body>

<div class="logout-card">

<div class="icon-circle">✓</div>

<h2>Logged Out</h2>

<p>
You have been safely logged out of
<strong>PhoneBazar</strong>.
See you again soon!
</p>

<a href="{% url 'login' %}" class="btn-login">
Login Again
</a>

<a href="/" class="home-link">
Return to Home
</a>

</div>

</body>
</html>
