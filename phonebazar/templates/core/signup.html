{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | PhoneBazar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    
body{
background-image:url("{% static 'images/back.png' %}");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
min-height:100vh;
font-family:Inter, sans-serif;
}

.signup-container{
max-width:450px;
margin:70px auto;
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.logo-box{
text-align:center;
margin-bottom:20px;
}

.logo-box img{
width:200px;
}

.header-text{
font-weight:700;
text-align:center;
margin-bottom:5px;
}

.sub-text{
color:#777;
font-size:14px;
text-align:center;
margin-bottom:25px;
}

/* Django form styling */

.django-form input,
.django-form select,
.django-form textarea{

height:50px;
border:1px solid #e0e0e0;
border-radius:8px;
font-size:14px;
padding:10px;
width:100%;
margin-bottom:15px;

}

.django-form input:focus,
.django-form select:focus{

border-color:#2eaf7d;
box-shadow:0 0 0 0.2rem rgba(46,175,125,.15);
outline:none;

}

/* button */

.btn-phonebazar{

background:#2eaf7d;
color:white;
font-weight:600;
height:50px;
border-radius:8px;
width:100%;
border:none;
margin-top:10px;

}

.btn-phonebazar:hover{
background:#248f66;
}

.login-link{
text-align:center;
margin-top:20px;
font-size:14px;
}

.login-link a{
color:#2eaf7d;
text-decoration:none;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<div class="signup-container">

<div class="logo-box">
<img src="{% static 'images/logo.png' %}" alt="PhoneBazar">
</div>

<h4 class="header-text">
Create Account
</h4>

<p class="sub-text">
Welcome to PhoneBazar. Join us to buy or sell phones.
</p>

<form method="post" class="django-form">

{% csrf_token %}

{% for field in form %}

<div class="mb-3">

<label class="form-label small fw-bold text-muted">
{{ field.label }}
</label>

{{ field }}

{% if field.errors %}
<div class="text-danger small">
{{ field.errors.0 }}
</div>
{% endif %}

</div>

{% endfor %}

<button type="submit" class="btn btn-phonebazar">
Continue
</button>

</form>

<div class="login-link">

Already have an account?

<a href="{% url 'login' %}">
Login
</a>

</div>

</div>

</div>

</body>

</html>
