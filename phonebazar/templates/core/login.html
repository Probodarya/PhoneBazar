{% load static %}
<!DOCTYPE html>
<html>
<head>

<title>Login | PhoneBazar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background-image:url("{% static 'images/back.png' %}");

font-family:Inter, sans-serif;
min-height:100vh;
display:flex;
align-items:center;
}


.auth-card{
max-width:420px;
margin:auto;
background:white;
padding:40px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.logo{
width:180px;
display:block;
margin:auto;
margin-bottom:20px;
}

.btn-phonebazar{
background:#2eaf7d;
border:none;
color:white;
height:48px;
border-radius:10px;
font-weight:600;
width:100%;
}

.btn-phonebazar:hover{
background:#248f66;
}

</style>

</head>

<body>

<div class="container">

<div class="auth-card">

<img src="{% static 'images/logo.png' %}" class="logo">

<h4 class="text-center fw-bold mb-3">Login to PhoneBazar</h4>

<form method="post">

{% csrf_token %}

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control">
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" name="password" class="form-control">
</div>

<button class="btn btn-phonebazar">Login</button>

</form>

<div class="text-center mt-3">

<a href="{% url 'forgot_password' %}">
Forgot Password?
</a>

</div>

<div class="text-center mt-2">

Don't have account?

<a href="{% url 'signup' %}">
Create Account
</a>

</div>

</div>

</div>

</body>
</html>
