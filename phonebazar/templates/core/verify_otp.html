<div class="verify-wrapper">
    <div class="otp-card">
        <div class="icon-box">
            <img src="/static/images/logo.png" alt="Mail"> </div>
        <h2>Verify Your Email</h2>
        <p>A 6-digit verification code has been sent to <br> 
           <strong>{{ email }}</strong></p>
        
        <form method="POST" action="{% url 'verify_otp' %}">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="input-group">
                <input type="text" name="otp" id="otp" 
                       maxlength="6" autocomplete="off" 
                       placeholder="· · · · · ·" required>
            </div>

            <button type="submit" class="btn-verify">Verify & Activate</button>
        </form>

        <div class="resend-text">
            Didn't receive the code? <a href="#">Resend OTP</a>
        </div>

        {% if error %}
            <div class="error-bubble">{{ error }}</div>
        {% endif %}
    </div>
</div>
