{% load static %}
<style>
    /* Auth Page Wrapper */
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        background-color: #f4f7f6;
        padding: 80px;

         background: linear-gradient(
            rgba(106, 118, 114, 0.85),
            rgba(121, 139, 133, 0.85)
        ),
        url("{% static 'images/back.png' %}");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    
    }

    /* Professional Card Design */
    .otp-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        max-width: 420px;
        width: 100%;
        text-align: center;
        border: 1px solid #eee;
    }

    .otp-card h2 {
        color: #2c3e50;
        font-size: 28px;
        margin-bottom: 12px;
        font-weight: 700;
    }

    .otp-card p {
        color: #7f8c8d;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    /* Input Field Styling */
    .input-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .input-group input {
        width: 100%;
        padding: 14px 18px;
        font-size: 16px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box; /* Ensures padding doesn't affect width */
    }

    .input-group input:focus {
        border-color: #f97316; /* Orange accent from your email template */
        box-shadow: 0 0 8px rgba(249, 115, 22, 0.15);
    }

    /* Button Styling */
    .btn-verify {
        width: 100%;
        background-color: #2c3e50;
        color: white;
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-verify:hover {
        background-color: #1a252f;
        transform: translateY(-1px);
    }

    .btn-verify:active {
        transform: translateY(0);
    }

    /* Error/Success Messages */
    .message-area {
        margin-top: 20px;
    }

    .alert {
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .alert-error {
        background-color: #fff1f2;
        color: #be123c;
        border: 1px solid #fecdd3;
    }
</style>

<div class="auth-container">
    <div class="otp-card">
        <div style="font-size: 50px; margin-bottom: 15px;">🔒</div>
        
        <h2>Forgot Password?</h2>
        <p>Enter your email address below. We'll send you a 6-digit OTP to safely reset your password.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <input type="email" name="email" placeholder="name@example.com" required>
            </div>
            
            <button type="submit" class="btn-verify">Send Verification Code</button>
        </form>

        <div class="message-area">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        <div style="margin-top: 25px;">
            <a href="{% url 'login' %}" style="text-decoration: none; color: #94a3b8; font-size: 14px;">
                &larr; Back to Login
            </a>
        </div>
    </div>
</div>
