{% extends "base.html" %}

{% block content %}

<style>

/* background */

.checkout-bg{
background:#f8fafc;
min-height:100vh;
}

/* card */

.checkout-card{
border-radius:18px;
border:none;
}

/* product box */

.product-box{
background:#f1f5f9;
border-radius:14px;
padding:20px;
}

/* order button */

.btn-order{
background:linear-gradient(135deg,#3949ab,#1a237e);
color:white;
font-weight:600;
border-radius:30px;
padding:12px;
transition:.3s;
}

.btn-order:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,.15);
color:white;
}

</style>



<div class="container checkout-bg py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card checkout-card shadow-sm p-4">

<h4 class="fw-bold mb-4">
Confirm Your Order
</h4>


<!-- Product Summary -->

<div class="product-box d-flex align-items-center mb-4">

<img src="{{ phone.image.url }}"
class="me-4"
style="width:100px;height:100px;object-fit:contain">

<div>

<h5 class="fw-bold">
{{ phone.brand }} {{ phone.model_name }}
</h5>

<p class="text-muted mb-1">
IMEI: {{ phone.imei_number }}
</p>

<span class="badge bg-success">
Verified Device
</span>

</div>

</div>


<!-- Price -->

<div class="d-flex justify-content-between mb-3">

<span class="text-muted">
Device Price
</span>

<span class="fw-bold">
₹{{ phone.price }}
</span>

</div>

<div class="d-flex justify-content-between mb-3">

<span class="text-muted">
Delivery
</span>

<span class="text-success fw-bold">
FREE
</span>

</div>


<hr>


<div class="d-flex justify-content-between mb-4">

<h5 class="fw-bold">
Total
</h5>

<h4 class="fw-bold text-primary">
₹{{ phone.price }}
</h4>

</div>



<!-- Place Order -->

<form method="POST">

{% csrf_token %}

<button type="submit" class="btn btn-order w-100">

Proceed to Payment

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
