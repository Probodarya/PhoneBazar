{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-3">Rate Your Purchase</h3>
            <p class="text-muted">Item: <strong>{{ order.phone_listing.brand }} {{ order.phone_listing.model_name }}</strong></p>
            <hr>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}<small class="text-muted d-block">{{ field.help_text }}</small>{% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-warning w-100 fw-bold">Submit Review</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
