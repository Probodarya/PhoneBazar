{% extends 'base.html' %}
{% block content %}


<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
                <i class="bi bi-cloud-arrow-up display-1 text-primary mb-4"></i>
                <h2 class="fw-bold">Bulk Inventory Upload</h2>
                <p class="text-muted mb-4">Upload a .csv file to add multiple devices to your Surat store instantly.</p>
                
                <div class="alert alert-light border mb-4">
                    <small class="text-dark">
                        <i class="bi bi-info-circle me-1"></i> 
                        Don't have a file? <a href="#" class="fw-bold text-primary">Download CSV Template</a>
                    </small>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-4">
                        <input type="file" name="file" class="form-control form-control-lg bg-light border-0" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold" style="background-color: #3f51b5;">
                        IMPORT INVENTORY
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
