{% extends 'base.html' %}
{% block content %}
<div class="container text-center mt-5">
    <div class="card p-5 shadow border-0">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
        <h1 class="mt-3">Payment Held in Escrow</h1>
        <p class="lead">Your payment for <strong>{{ txn.listing.model_name }}</strong> is safe.</p>
        
        <div class="bg-light p-3 rounded mb-4">
            <p class="mb-0 text-muted">Transaction ID</p>
            <h4 class="fw-bold">{{ txn.transaction_id }}</h4>
        </div>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'buyer_dashboard' %}" class="btn btn-primary">Track Order</a>
            <a href="{% url 'marketplace_home' %}" class="btn btn-outline-secondary">Continue Shopping</a>
        </div>
    </div>
</div>
{% endblock %}
